server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Los documentos se suben como PDF de hasta 20 MB y la solicitud de sustentación
    # lleva hasta tres (mismo límite que spring.servlet.multipart.max-request-size)
    client_max_body_size 65m;

    # --- PROXY INVERSO AL BACKEND ---
    location /api/ {
        # 'backend' es el nombre del servicio en el docker-compose.
        # '8080' es el puerto interno de Spring Boot.
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cargas y descargas de archivos grandes
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- ENRUTAMIENTO SPA (ANGULAR) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html no se guarda en caché: así el navegador toma siempre la versión
    # desplegada. Los .js y .css llevan un hash en el nombre y sí se pueden cachear.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Optimización de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
