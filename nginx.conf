# Límite de inicios de sesión por dirección IP, además del bloqueo por correo del backend: frena
# a quien prueba muchas contraseñas o muchos correos desde el mismo equipo. 20 por minuto con
# ráfagas de 20 no afecta a un usuario normal ni a una sala de cómputo detrás de una misma IP.
limit_req_zone $binary_remote_addr zone=inicio_sesion:10m rate=20r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de Nginx en las respuestas ni en las páginas de error
    server_tokens off;

    # Los documentos se suben como PDF de hasta 20 MB y la solicitud de sustentación
    # lleva hasta tres (mismo límite que spring.servlet.multipart.max-request-size)
    client_max_body_size 65m;

    # --- PROXY INVERSO AL BACKEND ---
    # Cabeceras para todas las peticiones al backend (con la IP real del cliente para la auditoría)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/v1/sgtg/auth/login {
        limit_req zone=inicio_sesion burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
    }

    location /api/ {
        # 'backend' es el nombre del servicio en el docker-compose.
        # '8080' es el puerto interno de Spring Boot.
        proxy_pass http://backend:8080;

        # Cargas y descargas de archivos grandes
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- ENRUTAMIENTO SPA (ANGULAR) ---
    # Las respuestas del backend ya traen sus cabeceras de seguridad (Spring Security); las de la
    # aplicación las agrega cada bloque, porque un add_header dentro de un location reemplaza a
    # los del server.
    location / {
        include /etc/nginx/cabeceras-seguridad.conf;
        try_files $uri $uri/ /index.html;
    }

    # index.html no se guarda en caché: así el navegador toma siempre la versión
    # desplegada. Los .js y .css llevan un hash en el nombre y sí se pueden cachear.
    location = /index.html {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Optimización de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
