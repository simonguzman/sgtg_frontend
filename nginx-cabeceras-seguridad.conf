# Cabeceras de seguridad de la aplicación (se incluyen en cada location de nginx.conf).

# Política de contenido: solo se ejecutan los scripts propios (un script inyectado no corre) y solo
# se conecta con el mismo servidor. Estilos y fuentes también de Google Fonts; los estilos en línea
# los necesita Angular para los estilos de los componentes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# La aplicación no se puede mostrar dentro de otra página (evita el clickjacking)
add_header X-Frame-Options "DENY" always;
# El navegador no adivina el tipo de los archivos
add_header X-Content-Type-Options "nosniff" always;
# A otros sitios solo se les envía el dominio, nunca la ruta (que lleva identificadores)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Sin acceso a cámara, micrófono, ubicación ni pagos
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Con HTTPS en producción: el navegador solo usará HTTPS durante un año
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
