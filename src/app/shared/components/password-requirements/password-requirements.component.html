<ul class="flex flex-col gap-1 text-sm" aria-label="Requisitos de la contraseña">
  @for (requisito of requisitos; track requisito.texto; let i = $index) {
    <li class="flex items-center gap-2"
        [class.text-state-approved]="cumple(i)"
        [class.text-text-body]="!cumple(i)">
      <span class="material-symbols-outlined select-none" style="font-size: 18px" aria-hidden="true">
        {{ cumple(i) ? 'check_circle' : 'radio_button_unchecked' }}
      </span>
      <span>{{ requisito.texto }}</span>
      <span class="sr-only">{{ cumple(i) ? '(cumple)' : '(falta)' }}</span>
    </li>
  }
</ul>
