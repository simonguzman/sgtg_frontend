<p-dialog
  [visible]="isOpen"
  (visibleChange)="isOpen = $event"
  (onHide)="closeModal()"
  [modal]="true"
  styleClass="custom-modal"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '540px' }"
>
  <ng-template pTemplate="header">
    <h2 class="text-primary font-bold font-display text-size-sidebar-title w-full text-justify m-0">
      Anular trabajo de grado
    </h2>
  </ng-template>
  <div class="flex flex-col gap-4 py-2 px-2">
    <p class="text-gray-700 font-sans text-size-section text-justify leading-relaxed m-0">
      El trabajo <strong>"{{ title }}"</strong> quedará cancelado y se archivará en el historial. Esta acción no se
      puede deshacer.
    </p>
    <label for="annul-justification" class="text-size-body font-semibold text-gray-700">Justificación <span class="text-alert">*</span></label>
    <textarea
      id="annul-justification"
      rows="4"
      class="w-full border rounded-md p-2 text-size-body"
      [class.border-alert]="showError()"
      [value]="justification()"
      (input)="updateJustification($any($event.target).value)"
      placeholder="Motivo de la anulación"
    ></textarea>
    @if (showError()) {
      <span class="text-textbox-alert">La justificación es obligatoria.</span>
    }
    <div class="flex justify-end gap-2">
      <app-button-component label="Cancelar" variant="secondary" (onClick)="closeModal()"></app-button-component>
      <app-button-component
        label="Anular"
        variant="primary"
        [disabled]="loading"
        (onClick)="confirmAction()"
      ></app-button-component>
    </div>
  </div>
</p-dialog>
