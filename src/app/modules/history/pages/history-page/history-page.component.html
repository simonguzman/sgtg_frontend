<div class="w-full">
  <div class="bg-white rounded-lg shadow-sm p-6">
    <h2 class="text-size-sidebar-title font-semibold text-gray-800">Trabajos de grado archivados</h2>
    <p class="text-size-body text-gray-500 mt-1">
      Trabajos terminados, no aprobados, cancelados o anulados. Consulta cada etapa con sus documentos y versiones.
    </p>
    <div class="mt-6">
      <app-table-component
        [value]="tableData()"
        [columns]="columns"
        [paginator]="true"
        (actionClick)="handleTableAction($event)"
        [emptyMessage]="'No tienes trabajos de grado archivados.'"
      ></app-table-component>
    </div>
  </div>
</div>
<app-description-modal
  [isOpen]="descriptionModal().show"
  [titleDescription]="descriptionModal().title"
  [description]="descriptionModal().content"
  (onClose)="descriptionModal.set({ show: false, title: '', content: '' })"
></app-description-modal>
