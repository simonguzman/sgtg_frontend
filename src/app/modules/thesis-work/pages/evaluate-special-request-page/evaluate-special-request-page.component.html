<div class="w-full min-h-screen bg-[#F8F9FA] p-4 md:p-8">
  <div class="max-w-7xl mx-auto flex flex-col gap-6">
    <button (click)="goBack()" class="flex items-center gap-2 text-primary font-bold group w-fit transition-opacity hover:opacity-80">
      <span class="material-symbols-outlined text-primary text-size-header-title transition-transform duration-300 ease-in-out group-hover:-translate-x-1.5">
        arrow_back
      </span>
      <span class="return-arrow-option">Regresar</span>
    </button>
    @if (thesisWorkState() && specialRequestState()) {
      <app-evaluate-special-request-form
        [thesisWork]="thesisWorkState()!"
        [specialRequest]="specialRequestState()!"
        [isSubmitting]="isSubmitting()"
        (onSave)="handleSaveTriggered($event)"
        (onBack)="goBack()"
        (onDownloadDocument)="downloadDocument($event)">
      </app-evaluate-special-request-form>
    }

    <app-confirmation-action-modal
      [isOpen]="isConfirmModalOpen()"
      description="¿Está seguro de registrar la decisión del Consejo sobre esta solicitud? Se notificará a los participantes y se actualizará el trabajo de grado."
      (onClose)="isConfirmModalOpen.set(false)"
      (confirm)="processSpecialRequestEvaluation()">
    </app-confirmation-action-modal>
  </div>
</div>
