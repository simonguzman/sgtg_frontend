<div class="w-full min-h-screen bg-[#F8F9FA] p-4 md:p-8">
  <app-info-banner title="Seguimiento de Correcciones de Sustentación" class="mb-6 block">
    Si la sustentación quedó <strong>aprobada con observaciones</strong>, el <strong>director</strong> radica
    los ajustes (y anexos, opcionales) en 10 días hábiles y el <strong>jurado coordinador</strong> verifica si cumplen.
  </app-info-banner>


  <div class="flex justify-between items-center mb-6">
    <button
      (click)="goBack()"
      class="flex items-center gap-2 text-primary transition-colors font-bold group"
    >
      <span class="material-symbols-outlined text-primary text-size-sidebar-title group-hover:-translate-x-1 transition-transform">
        arrow_back
      </span>
      <span class="return-arrow-option">Regresar</span>
    </button>

    <div class="flex gap-3">
      @if (canDirectorUpload()) {
        <app-button-component
          label="Radicar ajustes"
          variant="primary"
          (onClick)="navigateToUploadCorrections()">
        </app-button-component>
      }

      @if (canJurorEvaluate()) {
        <app-button-component
          label="Verificar ajustes"
          variant="primary"
          (onClick)="navigateToEvaluateCorrections()">
        </app-button-component>
      }
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-md border border-gray-100 p-4">
    <app-table-component
      [value]="tableData()"
      [columns]="columns"
      [paginator]="true"
      (actionClick)="handleTableAction($event)"
      emptyMessage="No se han cargado documentos de corrección en este proyecto todavía.">
    </app-table-component>
  </div>

</div>

<app-register-information-modal
  [isOpen]="isDetailsModalOpen()"
  [modalHeader]="'Detalles del Paquete de Correcciones'"
  [subTitle]="'Información de la Entrega'"
  [title]="currentThesisWork()?.preliminaryDraftData?.proposalData?.title || 'Sin título registrado'"
  [comments]="'Paquete de correcciones cargado tras la sustentación y sujeto a revisión por parte del jurado calificador.'"
  [modality]="modalityName()"
  [student]="studentName()"
  [director]="directorName()"
  [codirector]="codirectorName()"
  [adviser]="advisorName()"
  [chargeDate]="ensureDate(selectedDelivery()?.uploadDate)"
  [state]="selectedDelivery()?.monograph?.status"
  [documents]="selectedDeliveryDocuments()"
  (onClose)="isDetailsModalOpen.set(false)"
  (onDownloadFile)="downloadDocumentByName($event)">
</app-register-information-modal>
