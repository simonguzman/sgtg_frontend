<div class="pt-2 max-w-5xl mx-auto pb-10">

  <div class="flex justify-between items-center mb-6">
    <button
      (click)="facade.goBack()"
      class="flex items-center gap-2 text-primary transition-colors font-bold group"
    >
      <span class="material-symbols-outlined text-primary text-size-sidebar-title group-hover:-translate-x-1 transition-transform">
        arrow_back
      </span>
      <span class="return-arrow-option">Regresar</span>
    </button>

    @if (facade.details()) {
      <div class="flex gap-4">
        <app-button-component
          label="Evaluaciones realizadas"
          variant="primary"
          (onClick)="navigateTo('evaluations_performed')"
        ></app-button-component>
        <app-button-component
          label="Documentos cargados"
          variant="primary"
          (onClick)="navigateTo('loaded_documents')"
        ></app-button-component>
      </div>
    }
  </div>

  @if (facade.isLoading()) {
    <div class="text-center text-text-body font-display my-10">
      Cargando información estructural del trabajo de grado...
    </div>
  }

  @if (facade.details(); as details) {
    <app-work-details [view]="details" (download)="facade.downloadDocument($event)"></app-work-details>
  }

</div>
