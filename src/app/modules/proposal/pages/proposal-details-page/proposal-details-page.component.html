<div class="pt-2 max-w-5xl mx-auto">

  <div class="flex justify-between items-center mb-6">
    <button
      (click)="facade.goBack()"
      class="flex items-center gap-2 text-primary transition-colors font-bold group"
    >
      <span class="material-symbols-outlined text-primary font-semibold text-size-sidebar-title font-display group-hover:-translate-x-1 transition-transform">
        arrow_back
      </span>
      <span class="return-arrow-option">Regresar</span>
    </button>

    @if (proposal()) {
      <div class="flex gap-4">
        <app-button-component
          label="Evaluaciones realizadas"
          variant="primary"
          (onClick)="navigateToEvaluations()"
        ></app-button-component>
        <app-button-component
          label="Propuestas cargadas"
          variant="primary"
          (onClick)="navigateToLoadedProposals()"
        ></app-button-component>
      </div>
    }
  </div>

  @if (!view()) {
    <div class="text-center text-text-body">Cargando información...</div>
  }

  @if (view(); as details) {
    <div class="pb-10">
      <app-work-details [view]="details" (download)="facade.downloadDocument($event)"></app-work-details>
    </div>
  }

</div>
