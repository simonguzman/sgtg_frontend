# Nginx de producción (docker-compose.prod.yml): lo mismo de nginx.conf, pero solo por HTTPS.
# El puerto 80 solo redirige a HTTPS y atiende los desafíos de Let's Encrypt.

limit_req_zone $binary_remote_addr zone=inicio_sesion:10m rate=20r/m;

log_format con_solicitud '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" solicitud=$request_id';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log con_solicitud;

    # Renovación del certificado con certbot --webroot -w ./acme
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log con_solicitud;

    # --- TLS (perfil "intermediate" de Mozilla: TLS 1.2 y 1.3, sin cifrados débiles) ---
    ssl_certificate     /etc/nginx/certificados/fullchain.pem;
    ssl_certificate_key /etc/nginx/certificados/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (el navegador recuerda por un año que este sitio solo se abre por HTTPS): va en cada location de
    # la aplicación; las respuestas del API ya la traen de Spring Security

    client_max_body_size 65m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;

    location = /api/v1/sgtg/auth/login {
        limit_req zone=inicio_sesion burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
