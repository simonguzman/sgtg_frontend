# Sistema completo de SGTG: base de datos, backend (Spring Boot) y frontend (Angular + Nginx).
#
# Requiere los dos repositorios como carpetas hermanas:
#   workspace/
#   ├── sgtg_backend/   (con su archivo .env; ver sgtg_backend/.env.example)
#   └── sgtg_frontend/  (este archivo)
#
# Desde sgtg_frontend:  docker compose up --build -d
# La aplicación queda en http://localhost:4200 (el frontend reenvía /api al backend).
name: sgtg

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: oracle
      MYSQL_DATABASE: sgtg
      MYSQL_TCP_PORT: 3307
    ports:
      - "3307:3307"
    command: --port=3307 --bind-address=0.0.0.0
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3307", "-uroot", "-poracle"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ../sgtg_backend
    restart: unless-stopped
    # Administrador inicial y demás variables del backend (SGTG_ADMIN_EMAIL, SGTG_ADMIN_PASSWORD, ...)
    env_file:
      - ../sgtg_backend/.env
    environment:
      SPRING_APPLICATION_NAME: backend
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3307/sgtg?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: oracle
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin
      # La base de desarrollo conserva los datos entre reinicios (las pruebas usan create-drop).
      # Para empezar de cero: docker compose down -v
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      # Entorno de desarrollo: reloj ajustable para probar flujos que dependen del tiempo (Thunder Client)
      SGTG_RELOJ_AJUSTABLE: ${SGTG_RELOJ_AJUSTABLE:-true}
      # Archivos de los trabajos de grado (PDF), en un volumen para que no se pierdan al recrear el contenedor
      SGTG_ARCHIVOS_DIRECTORIO: /app/archivos
    # Expuesto también directamente para Thunder Client y pruebas del API
    ports:
      - "8080:8080"
    volumes:
      - archivos_data:/app/archivos
    depends_on:
      # Espera a que MySQL acepte conexiones, no solo a que el contenedor inicie
      mysql:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  archivos_data:
